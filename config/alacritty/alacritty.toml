[env]
TERM = "xterm-256color"

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 1.0
decorations = "full"
startup_mode = "Windowed"
option_as_alt = "Both"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = false

[terminal]
shell = { program = "/usr/bin/zsh", args = ["-l"] }

[general]
import = [
  "~/.config/alacritty/theme.toml"
]
